<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Stok</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --theme-primary: #5b21b6;
            --theme-dark: #4c1d95;
            --theme-light: #7c3aed;
            --theme-soft-bg: #f5f3ff;
            --theme-pill-bg: #e2d9f3;
        }

        html, body {
            margin: 0;
            padding: 0;
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.76rem;
            color: #1e293b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .stok-shell {
            padding: 8px;
            max-width: 980px;
            margin: 0 auto;
        }

        .top-sub-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 7px 10px;
            margin-bottom: 8px;
        }

        .sub-title-badge {
            font-size: 0.76rem;
            font-weight: 800;
            color: var(--theme-dark);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .sync-status-pill {
            font-size: 0.66rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 50rem;
            background: #f1f5f9;
            color: #475569;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .btn-pill-sm {
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 50rem;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-pill-sm:hover { background: #f1f5f9; }

        .submenu-strip {
            display: flex;
            align-items: center;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
            margin-bottom: 8px;
        }

        .submenu-chip {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #334155;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: 50rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            white-space: nowrap;
        }

        .submenu-chip.active {
            background: var(--theme-primary);
            color: #ffffff;
            border-color: var(--theme-primary);
        }

        .submenu-chip.history-chip.active {
            background: #0f766e;
            color: #ffffff;
            border-color: #0f766e;
        }

        .submenu-chip.add-chip {
            background: var(--theme-soft-bg);
            color: var(--theme-dark);
            border: 1px dashed var(--theme-light);
        }

        .mode-tabs-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .mode-tab-btn {
            border: 1px solid #e2e8f0;
            background: #ffffff;
            color: #475569;
            font-size: 0.72rem;
            font-weight: 700;
            padding: 5px 11px;
            border-radius: 8px;
            cursor: pointer;
        }
        .mode-tab-btn.active {
            background: var(--theme-soft-bg);
            color: var(--theme-dark);
            border-color: var(--theme-light);
        }

        .card-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px;
            margin-bottom: 8px;
        }

        .form-label { font-size: 0.71rem; font-weight: 700; margin-bottom: 2px; color: #334155; }
        .form-control, .form-select { font-size: 0.75rem; padding: 5px 8px; border-radius: 8px; }
        .btn { font-size: 0.74rem; padding: 5px 11px; border-radius: 8px; }

        .table-stok th {
            background: #f1f5f9;
            color: #334155;
            font-size: 0.67rem;
            text-transform: uppercase;
            padding: 5px 6px;
            white-space: nowrap;
        }
        .table-stok td {
            font-size: 0.72rem;
            padding: 5px 6px;
            vertical-align: middle;
        }

        .android-dialog-content {
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 26px rgba(15, 23, 42, 0.2);
            padding: 4px;
        }
        .android-btn-pill { border-radius: 50rem; font-size: 0.74rem; font-weight: 600; padding: 5px 14px; }
    </style>
</head>
<body>

    <div class="stok-shell">
        <div class="top-sub-bar">
            <div class="sub-title-badge">
                <i class="fas fa-boxes-stacked"></i>
                <span id="activeSubTitle">Stok - Jumbo Roll</span>
            </div>
            <div class="d-flex align-items-center gap-1">
                <span id="syncStatusBadge" class="sync-status-pill">
                    <i class="fas fa-circle-dot"></i><span>Lokal</span>
                </span>
                <button type="button" class="btn-pill-sm" onclick="downloadHtmlDenganSubMenu()" title="Simpan salinan HTML berisi sub-menu & data terbaru">
                    <i class="fas fa-file-code"></i><span>Simpan HTML</span>
                </button>
            </div>
        </div>

        <!-- Baris Sub-Menu (Stok + Riwayat + Tambah Sub-Menu) -->
        <div id="subMenuStrip" class="submenu-strip"></div>

        <!-- VIEW 1: SUB-MENU STOK AKTIF (MASUK, REQUEST KELUAR & STOK) -->
        <div id="viewStokSubMenu">
            <div class="mode-tabs-bar">
                <button type="button" id="tabBtnMasuk" class="mode-tab-btn active" onclick="gantiModeForm('masuk')">
                    <i class="fas fa-arrow-down-to-line text-success me-1"></i>Barang Masuk (+Stok)
                </button>
                <button type="button" id="tabBtnRequest" class="mode-tab-btn" onclick="gantiModeForm('request')">
                    <i class="fas fa-paper-plane text-danger me-1"></i>Request Pengeluaran (-Stok)
                </button>
            </div>

            <!-- FORM 1: BARANG MASUK / PENAMBAHAN STOK -->
            <div id="panelFormMasuk" class="card-panel">
                <form id="formBarangMasuk" onsubmit="prosesBarangMasuk(event)">
                    <div class="row g-2 align-items-end">
                        <div class="col-6 col-sm-2">
                            <label class="form-label">Tanggal Masuk <span class="text-danger">*</span></label>
                            <input type="date" id="tglMasuk" class="form-control" required>
                        </div>
                        <div class="col-6 col-sm-3">
                            <label class="form-label">Nama / Kode Item <span class="text-danger">*</span></label>
                            <input type="text" id="masukNama" class="form-control" list="datalistItemAktif" placeholder="Ketik / pilih item..." required>
                        </div>
                        <div class="col-6 col-sm-2">
                            <label class="form-label">Asal Barang <span class="text-danger">*</span></label>
                            <input type="text" id="masukAsal" class="form-control" list="datalistAsalBarang" placeholder="Supplier / Asal" autocomplete="off" required>
                        </div>
                        <div class="col-4 col-sm-1">
                            <label class="form-label">QTY <span class="text-danger">*</span></label>
                            <input type="number" id="masukJumlah" class="form-control" min="1" placeholder="0" required>
                        </div>
                        <div class="col-4 col-sm-2">
                            <label class="form-label">Satuan</label>
                            <input type="text" id="masukSatuan" class="form-control" placeholder="Roll/Pcs">
                        </div>
                        <div class="col-4 col-sm-2 d-grid">
                            <button type="submit" class="btn btn-success fw-bold">
                                <i class="fas fa-plus me-1"></i>Tambah
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- FORM 2: REQUEST PENGELUARAN BARANG -->
            <div id="panelFormRequest" class="card-panel d-none">
                <form id="formRequestKeluar" onsubmit="prosesRequestKeluar(event)">
                    <div class="row g-2 align-items-end">
                        <div class="col-6 col-sm-2">
                            <label class="form-label">Tanggal Keluar <span class="text-danger">*</span></label>
                            <input type="date" id="tglKeluar" class="form-control" required>
                        </div>
                        <div class="col-6 col-sm-4">
                            <label class="form-label">Nama / Kode Item <span class="text-danger">*</span></label>
                            <input type="text" id="requestNama" class="form-control" list="datalistItemAktif" placeholder="Pilih / ketik item..." required>
                        </div>
                        <div class="col-6 col-sm-2">
                            <label class="form-label">QTY Request <span class="text-danger">*</span></label>
                            <input type="number" id="requestJumlah" class="form-control" min="1" placeholder="0" required>
                        </div>
                        <div class="col-6 col-sm-2">
                            <label class="form-label">Peminta / Dept <span class="text-danger">*</span></label>
                            <input type="text" id="requestPeminta" class="form-control" placeholder="Contoh: Produksi" required>
                        </div>
                        <div class="col-12 col-sm-2 d-grid">
                            <button type="submit" class="btn btn-danger fw-bold">
                                <i class="fas fa-minus me-1"></i>Request (-Stok)
                            </button>
                        </div>
                    </div>
                </form>
            </div>

            <datalist id="datalistItemAktif"></datalist>
            <datalist id="datalistAsalBarang"></datalist>

            <!-- TABEL STOK TERKINI SUB-MENU AKTIF -->
            <div class="card-panel">
                <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
                    <span class="fw-bold text-secondary" id="totalItemInfo">0 item</span>
                    <input type="text" id="cariItemStok" class="form-control form-control-sm" style="max-width: 190px;" placeholder="Cari item..." oninput="renderTabelStok()">
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-stok mb-0">
                        <thead>
                            <tr>
                                <th class="text-center" width="7%">No</th>
                                <th>Nama / Kode Item</th>
                                <th class="text-center" width="16%">Stok</th>
                                <th width="14%">Satuan</th>
                                <th class="text-center" width="22%">Aksi Cepat</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyStokSubMenu">
                            <tr><td colspan="5" class="text-center text-muted py-3">Belum ada data stok.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- VIEW 2: SUB-MENU RIWAYAT TERSENDIRI -->
        <div id="viewRiwayatSubMenu" class="d-none">
            <div class="card-panel">
                <div class="row g-2 align-items-end mb-2">
                    <div class="col-6 col-sm-3">
                        <label class="form-label">Filter Kategori</label>
                        <select id="filterRiwayatSub" class="form-select" onchange="renderRiwayatSubMenu()">
                            <option value="ALL">Semua Kategori</option>
                        </select>
                    </div>
                    <div class="col-6 col-sm-3">
                        <label class="form-label">Jenis Transaksi</label>
                        <select id="filterRiwayatJenis" class="form-select" onchange="renderRiwayatSubMenu()">
                            <option value="ALL">Semua (Masuk & Keluar)</option>
                            <option value="MASUK">Barang Masuk</option>
                            <option value="KELUAR">Request Keluar</option>
                        </select>
                    </div>
                    <div class="col-12 col-sm-4">
                        <label class="form-label">Cari Item / Asal / Peminta</label>
                        <input type="text" id="cariRiwayat" class="form-control" placeholder="Ketik item, asal, atau dept..." oninput="renderRiwayatSubMenu()">
                    </div>
                    <div class="col-12 col-sm-2 text-sm-end">
                        <span class="fw-bold text-secondary d-block" style="font-size: 0.7rem;" id="totalRiwayatInfo">0 transaksi</span>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-bordered table-hover table-stok mb-0">
                        <thead>
                            <tr>
                                <th class="text-center" width="5%">No</th>
                                <th width="12%">Tgl Masuk</th>
                                <th width="12%">Tgl Keluar</th>
                                <th width="10%">Jenis</th>
                                <th>Nama Item</th>
                                <th width="14%">Asal Barang</th>
                                <th class="text-center" width="10%">QTY</th>
                                <th class="text-center" width="10%">Sisa</th>
                                <th width="14%">Peminta / Ket</th>
                            </tr>
                        </thead>
                        <tbody id="tbodyRiwayatSubMenu">
                            <tr><td colspan="9" class="text-center text-muted py-3">Belum ada riwayat transaksi.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Tambah Sub-Menu Baru -->
    <div class="modal fade" id="modalTambahSubMenu" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title fw-bold">Tambah Sub-Menu Stok</h6>
                </div>
                <form id="formTambahSubMenu" onsubmit="tambahSubMenuBaru(event)">
                    <div class="modal-body pt-1 pb-2">
                        <div class="mb-2">
                            <label class="form-label">Nama Sub-Menu <span class="text-danger">*</span></label>
                            <input type="text" id="namaSubMenuBaru" class="form-control" placeholder="Contoh: Sheet / Booklet / Display" required>
                        </div>
                        <div class="mb-1">
                            <label class="form-label">Satuan Bawaan</label>
                            <input type="text" id="satuanSubMenuBaru" class="form-control" placeholder="Contoh: Sheet / Pcs">
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-1 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light text-secondary android-btn-pill" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary android-btn-pill">Buat Sub-Menu</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal Pesan / Peringatan -->
    <div class="modal fade" id="modalPesanStok" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title fw-bold" id="pesanJudul">Informasi</h6>
                </div>
                <div class="modal-body pt-1 pb-2">
                    <p id="pesanIsi" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0 pt-1">
                    <button type="button" class="btn btn-primary android-btn-pill" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Konfigurasi Sub-Menu, Stok & Riwayat Tersimpan di Dalam HTML -->
    <script id="subMenuConfig" type="application/json">
    {
      "submenus": [
        { "id": "jumbo-roll", "nama": "Jumbo Roll", "satuan": "Roll" },
        { "id": "karton", "nama": "Karton", "satuan": "Pcs" }
      ],
      "items": {},
      "history": {}
    }
    </script>

    <!-- Firebase Realtime Database SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const firebaseConfig = {
            
        };

        const FIREBASE_PATH = 'gudang/menu_stok';
        const LOCAL_KEY = 'menu_stok_dinamis_v8';

        let dbRef = null;
        let isApplyingRemote = false;

        function setSyncStatus(mode, label) {
            const el = document.getElementById('syncStatusBadge');
            if (!el) return;
            const colorMap = {
                ok: { bg: '#dcfce7', color: '#166534' },
                sync: { bg: '#e0e7ff', color: '#3730a3' },
                err: { bg: '#fee2e2', color: '#991b1b' },
                local: { bg: '#f1f5f9', color: '#475569' }
            };
            const st = colorMap[mode] || colorMap.local;
            el.style.background = st.bg;
            el.style.color = st.color;
            el.innerHTML = `<i class="fas fa-circle-dot"></i><span>${label}</span>`;
        }

        function initFirebaseRealtime() {
            if (!firebaseConfig.databaseURL || firebaseConfig.databaseURL.includes('YOUR_PROJECT_ID')) {
                setSyncStatus('local', 'Lokal');
                return;
            }
            try {
                const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(firebaseConfig);
                dbRef = firebase.database(app)apiKey: "AIzaSyA_QcHO8eB6JsJZslr9kFDLIhgZu0cXHBI",
  authDomain: "material-incomming.firebaseapp.com",
  databaseURL: "https://material-incomming-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "material-incomming",
  storageBucket: "material-incomming.firebasestorage.app",
  messagingSenderId: "323944053500",
  appId: "1:323944053500:web:b800addbf65b915dd33579".ref(FIREBASE_PATH);
                setSyncStatus('sync', 'Menghubungkan...');

                dbRef.on('value', (snapshot) => {
                    const remoteData = snapshot.val();
                    setSyncStatus('ok', 'Live');
                    if (!remoteData || typeof remoteData !== 'object') return;

                    const normalized = normalisasiState(remoteData);
                    if (normalized.updatedAt >= Number(stateStok.updatedAt || 0)) {
                        isApplyingRemote = true;
                        stateStok = normalized;
                        if (activeSubId !== 'RIWAYAT' && !stateStok.submenus.some(s => s.id === activeSubId)) {
                            activeSubId = stateStok.submenus[0].id;
                        }
                        try {
                            localStorage.setItem(LOCAL_KEY, JSON.stringify(stateStok));
                        } catch (e) {}
                        renderSubMenuStrip();
                        setTimeout(() => { isApplyingRemote = false; }, 120);
                    }
                }, () => {
                    setSyncStatus('err', 'Error DB');
                });
            } catch (e) {
                setSyncStatus('err', 'Error Init');
            }
        }

        function hariIniIso() {
            const d = new Date();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const h = String(d.getDate()).padStart(2, '0');
            return `${d.getFullYear()}-${m}-${h}`;
        }

        function formatTanggalID(tgl) {
            if (!tgl) return '-';
            const match = String(tgl).trim().match(/^(\d{4})-(\d{2})-(\d{2})/);
            return match ? `${match[3]}/${match[2]}/${match[1]}` : String(tgl);
        }

        function tampilkanPesan(judul, isi) {
            document.getElementById('pesanJudul').textContent = judul;
            document.getElementById('pesanIsi').textContent = isi;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPesanStok')).show();
        }

        function normalisasiState(raw) {
            const parsed = raw && typeof raw === 'object' ? raw : {};
            const submenus = Array.isArray(parsed.submenus) && parsed.submenus.length > 0
                ? parsed.submenus
                : [
                    { id: 'jumbo-roll', nama: 'Jumbo Roll', satuan: 'Roll' },
                    { id: 'karton', nama: 'Karton', satuan: 'Pcs' }
                ];

            const items = {};
            const history = {};
            if (parsed.items && typeof parsed.items === 'object') {
                Object.entries(parsed.items).forEach(([k, v]) => {
                    items[k] = Array.isArray(v) ? v : Object.values(v || {});
                });
            }
            if (parsed.history && typeof parsed.history === 'object') {
                Object.entries(parsed.history).forEach(([k, v]) => {
                    history[k] = Array.isArray(v) ? v : Object.values(v || {});
                });
            }

            return {
                submenus,
                items,
                history,
                updatedAt: Number(parsed.updatedAt || 0)
            };
        }

        function bacaKonfigurasiAwal() {
            const scriptEl = document.getElementById('subMenuConfig');
            let embedded = null;
            try {
                embedded = JSON.parse(scriptEl.textContent || '{}');
            } catch (e) {}

            try {
                const saved = localStorage.getItem(LOCAL_KEY);
                if (saved) {
                    return normalisasiState(JSON.parse(saved));
                }
            } catch (e) {}

            return normalisasiState(embedded);
        }

        let stateStok = bacaKonfigurasiAwal();
        let activeSubId = stateStok.submenus[0].id;
        let activeFormMode = 'masuk';

        document.getElementById('tglMasuk').value = hariIniIso();
        document.getElementById('tglKeluar').value = hariIniIso();

        function tulisKeBlokHtmlDanStorage(skipFirebasePush = false) {
            stateStok.updatedAt = Date.now();
            const jsonText = JSON.stringify(stateStok, null, 2);
            const scriptEl = document.getElementById('subMenuConfig');
            if (scriptEl) scriptEl.textContent = '\n' + jsonText + '\n    ';
            try {
                localStorage.setItem(LOCAL_KEY, JSON.stringify(stateStok));
            } catch (e) {}

            if (!skipFirebasePush && !isApplyingRemote && dbRef) {
                setSyncStatus('sync', 'Menyimpan...');
                dbRef.set(stateStok)
                    .then(() => setSyncStatus('ok', 'Live'))
                    .catch(() => setSyncStatus('err', 'Gagal Kirim'));
            }
        }

        function slugifyId(text) {
            const base = String(text || '')
                .toLowerCase()
                .trim()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-+|-+$/g, '');
            return (base || 'sub-menu') + '-' + Date.now().toString().slice(-4);
        }

        function getActiveSubMenu() {
            return stateStok.submenus.find(s => s.id === activeSubId) || stateStok.submenus[0];
        }

        function sinkronDropdownFilterRiwayat() {
            const select = document.getElementById('filterRiwayatSub');
            const prevVal = select.value;
            select.innerHTML = `<option value="ALL">Semua Kategori</option>`;
            stateStok.submenus.forEach(sub => {
                const opt = document.createElement('option');
                opt.value = sub.id;
                opt.textContent = sub.nama;
                select.appendChild(opt);
            });
            if (prevVal && Array.from(select.options).some(o => o.value === prevVal)) {
                select.value = prevVal;
            }
        }

        function gantiModeForm(mode) {
            activeFormMode = mode;
            const isMasuk = mode === 'masuk';
            document.getElementById('tabBtnMasuk').classList.toggle('active', isMasuk);
            document.getElementById('tabBtnRequest').classList.toggle('active', !isMasuk);
            document.getElementById('panelFormMasuk').classList.toggle('d-none', !isMasuk);
            document.getElementById('panelFormRequest').classList.toggle('d-none', isMasuk);
        }

        function refreshDatalistItem() {
            if (activeSubId === 'RIWAYAT') return;
            const current = getActiveSubMenu();
            const list = stateStok.items[current.id] || [];
            const dl = document.getElementById('datalistItemAktif');
            dl.innerHTML = list.map(i => `<option value="${i.nama}">Stok: ${Number(i.jumlah || 0)}</option>`).join('');
        }

        function refreshDatalistAsalBarang() {
            const dl = document.getElementById('datalistAsalBarang');
            if (!dl) return;

            const seen = new Map();
            Object.values(stateStok.history || {}).forEach(rows => {
                (rows || []).forEach(r => {
                    if (r && r.jenis === 'MASUK' && r.asalBarang) {
                        const clean = String(r.asalBarang).trim();
                        if (clean) {
                            const key = clean.toLowerCase();
                            if (!seen.has(key)) seen.set(key, clean);
                        }
                    }
                });
            });

            const sorted = Array.from(seen.values()).sort((a, b) => a.localeCompare(b, 'id'));
            dl.innerHTML = sorted.map(asal => `<option value="${asal}"></option>`).join('');
        }

        function renderSubMenuStrip() {
            const strip = document.getElementById('subMenuStrip');
            strip.innerHTML = '';

            stateStok.submenus.forEach(sub => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'submenu-chip' + (sub.id === activeSubId ? ' active' : '');
                btn.innerHTML = `<i class="fas fa-layer-group"></i><span>${sub.nama}</span>`;
                btn.onclick = () => pilihSubMenu(sub.id);
                strip.appendChild(btn);
            });

            const histBtn = document.createElement('button');
            histBtn.type = 'button';
            histBtn.className = 'submenu-chip history-chip' + (activeSubId === 'RIWAYAT' ? ' active' : '');
            histBtn.innerHTML = `<i class="fas fa-clock-rotate-left"></i><span>Riwayat</span>`;
            histBtn.onclick = () => pilihSubMenu('RIWAYAT');
            strip.appendChild(histBtn);

            const addBtn = document.createElement('button');
            addBtn.type = 'button';
            addBtn.className = 'submenu-chip add-chip';
            addBtn.innerHTML = `<i class="fas fa-plus"></i><span>Tambah Sub-Menu</span>`;
            addBtn.onclick = () => {
                document.getElementById('formTambahSubMenu').reset();
                bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTambahSubMenu')).show();
            };
            strip.appendChild(addBtn);

            refreshDatalistAsalBarang();

            const isHistoryView = activeSubId === 'RIWAYAT';
            document.getElementById('viewStokSubMenu').classList.toggle('d-none', isHistoryView);
            document.getElementById('viewRiwayatSubMenu').classList.toggle('d-none', !isHistoryView);

            if (isHistoryView) {
                document.getElementById('activeSubTitle').textContent = 'Stok - Riwayat Masuk & Keluar';
                sinkronDropdownFilterRiwayat();
                renderRiwayatSubMenu();
            } else {
                const current = getActiveSubMenu();
                document.getElementById('activeSubTitle').textContent = `Stok - ${current.nama}`;
                document.getElementById('masukSatuan').value = current.satuan || '';
                refreshDatalistItem();
                renderTabelStok();
            }
        }

        function pilihSubMenu(id) {
            activeSubId = id;
            renderSubMenuStrip();
        }

        function tambahSubMenuBaru(event) {
            event.preventDefault();
            const nama = document.getElementById('namaSubMenuBaru').value.trim();
            const satuan = document.getElementById('satuanSubMenuBaru').value.trim() || 'Pcs';
            if (!nama) return;

            const newSub = {
                id: slugifyId(nama),
                nama,
                satuan
            };

            stateStok.submenus.push(newSub);
            if (!stateStok.items[newSub.id]) stateStok.items[newSub.id] = [];
            if (!stateStok.history[newSub.id]) stateStok.history[newSub.id] = [];

            activeSubId = newSub.id;
            tulisKeBlokHtmlDanStorage();
            renderSubMenuStrip();

            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTambahSubMenu')).hide();
        }

        function prosesBarangMasuk(event) {
            event.preventDefault();
            const tglMasuk = document.getElementById('tglMasuk').value || hariIniIso();
            const nama = document.getElementById('masukNama').value.trim();
            const asalBarang = document.getElementById('masukAsal').value.trim();
            const qty = Number(document.getElementById('masukJumlah').value);
            const current = getActiveSubMenu();
            const satuan = document.getElementById('masukSatuan').value.trim() || current.satuan || '-';
            if (!nama || !asalBarang || !Number.isFinite(qty) || qty <= 0) return;

            if (!stateStok.items[current.id]) stateStok.items[current.id] = [];
            if (!stateStok.history[current.id]) stateStok.history[current.id] = [];

            let target = stateStok.items[current.id].find(
                x => x.nama.toLowerCase() === nama.toLowerCase()
            );

            let stokSesudah = 0;
            if (target) {
                stokSesudah = Number(target.jumlah || 0) + qty;
                target.jumlah = stokSesudah;
                target.satuan = satuan;
            } else {
                stokSesudah = qty;
                target = {
                    id: 'item-' + Date.now(),
                    nama,
                    jumlah: stokSesudah,
                    satuan
                };
                stateStok.items[current.id].push(target);
            }

            stateStok.history[current.id].unshift({
                id: 'trx-' + Date.now(),
                subId: current.id,
                subNama: current.nama,
                jenis: 'MASUK',
                tanggalMasuk: tglMasuk,
                tanggalKeluar: '',
                nama: target.nama,
                asalBarang: asalBarang,
                qty: qty,
                sisaStok: stokSesudah,
                keterangan: 'Barang Datang'
            });

            tulisKeBlokHtmlDanStorage();
            document.getElementById('masukNama').value = '';
            document.getElementById('masukAsal').value = '';
            document.getElementById('masukJumlah').value = '';
            refreshDatalistItem();
            refreshDatalistAsalBarang();
            renderTabelStok();
        }

        function prosesRequestKeluar(event) {
            event.preventDefault();
            const tglKeluar = document.getElementById('tglKeluar').value || hariIniIso();
            const nama = document.getElementById('requestNama').value.trim();
            const qty = Number(document.getElementById('requestJumlah').value);
            const peminta = document.getElementById('requestPeminta').value.trim();
            const current = getActiveSubMenu();
            if (!nama || !Number.isFinite(qty) || qty <= 0 || !peminta) return;

            const list = stateStok.items[current.id] || [];
            const target = list.find(x => x.nama.toLowerCase() === nama.toLowerCase());

            if (!target) {
                tampilkanPesan('Item Tidak Ditemukan', `Item "${nama}" belum ada di stok ${current.nama}.`);
                return;
            }

            const stokSaatIni = Number(target.jumlah || 0);
            if (stokSaatIni < qty) {
                tampilkanPesan('Stok Tidak Cukup', `Stok "${target.nama}" tersisa ${stokSaatIni}, tidak cukup untuk request ${qty}.`);
                return;
            }

            const sisaBaru = stokSaatIni - qty;
            target.jumlah = sisaBaru;

            if (!stateStok.history[current.id]) stateStok.history[current.id] = [];
            stateStok.history[current.id].unshift({
                id: 'trx-' + Date.now(),
                subId: current.id,
                subNama: current.nama,
                jenis: 'KELUAR',
                tanggalMasuk: '',
                tanggalKeluar: tglKeluar,
                nama: target.nama,
                asalBarang: '',
                qty: qty,
                sisaStok: sisaBaru,
                keterangan: peminta
            });

            tulisKeBlokHtmlDanStorage();
            document.getElementById('requestNama').value = '';
            document.getElementById('requestJumlah').value = '';
            document.getElementById('requestPeminta').value = '';
            refreshDatalistItem();
            renderTabelStok();
        }

        function aksiCepatStok(itemId, delta) {
            const current = getActiveSubMenu();
            const list = stateStok.items[current.id] || [];
            const target = list.find(x => x.id === itemId);
            if (!target) return;

            const stokLama = Number(target.jumlah || 0);
            if (delta < 0 && stokLama < Math.abs(delta)) {
                tampilkanPesan('Stok Tidak Cukup', `Stok "${target.nama}" tersisa ${stokLama}.`);
                return;
            }

            const stokBaru = Math.max(0, stokLama + delta);
            target.jumlah = stokBaru;

            if (!stateStok.history[current.id]) stateStok.history[current.id] = [];
            if (delta > 0) {
                stateStok.history[current.id].unshift({
                    id: 'trx-' + Date.now(),
                    subId: current.id,
                    subNama: current.nama,
                    jenis: 'MASUK',
                    tanggalMasuk: hariIniIso(),
                    tanggalKeluar: '',
                    nama: target.nama,
                    asalBarang: 'Gudang / Supplier',
                    qty: delta,
                    sisaStok: stokBaru,
                    keterangan: 'Penambahan Cepat'
                });
            } else {
                stateStok.history[current.id].unshift({
                    id: 'trx-' + Date.now(),
                    subId: current.id,
                    subNama: current.nama,
                    jenis: 'KELUAR',
                    tanggalMasuk: '',
                    tanggalKeluar: hariIniIso(),
                    nama: target.nama,
                    asalBarang: '',
                    qty: Math.abs(delta),
                    sisaStok: stokBaru,
                    keterangan: 'Pengeluaran Cepat'
                });
            }

            tulisKeBlokHtmlDanStorage();
            refreshDatalistItem();
            refreshDatalistAsalBarang();
            renderTabelStok();
        }

        function hapusItemStok(itemId) {
            const current = getActiveSubMenu();
            stateStok.items[current.id] = (stateStok.items[current.id] || []).filter(x => x.id !== itemId);
            tulisKeBlokHtmlDanStorage();
            refreshDatalistItem();
            renderTabelStok();
        }

        function renderTabelStok() {
            if (activeSubId === 'RIWAYAT') return;
            const current = getActiveSubMenu();
            const keyword = (document.getElementById('cariItemStok').value || '').trim().toLowerCase();
            const list = (stateStok.items[current.id] || []).filter(
                item => !keyword || String(item.nama || '').toLowerCase().includes(keyword)
            );

            document.getElementById('totalItemInfo').textContent = `${list.length} item (${current.nama})`;
            const tbody = document.getElementById('tbodyStokSubMenu');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-3">Belum ada item di sub-menu ${current.nama}.</td></tr>`;
                return;
            }

            list.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center text-muted fw-bold">${idx + 1}</td>
                    <td><strong>${item.nama}</strong></td>
                    <td class="text-center fw-bold text-primary">${Number(item.jumlah || 0).toLocaleString()}</td>
                    <td>${item.satuan || '-'}</td>
                    <td class="text-center">
                        <button type="button" class="btn btn-sm btn-outline-danger py-0 px-1 me-1" onclick="aksiCepatStok('${item.id}', -1)" title="Request / Kurangi 1">-1</button>
                        <button type="button" class="btn btn-sm btn-outline-success py-0 px-1 me-1" onclick="aksiCepatStok('${item.id}', 1)" title="Barang Masuk / Tambah 1">+1</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-1" onclick="hapusItemStok('${item.id}')" title="Hapus"><i class="fas fa-trash"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function ambilSemuaRiwayat() {
            const subMap = {};
            stateStok.submenus.forEach(s => { subMap[s.id] = s.nama; });
            const all = [];
            Object.entries(stateStok.history || {}).forEach(([subId, rows]) => {
                (rows || []).forEach(r => {
                    all.push({
                        ...r,
                        subId: r.subId || subId,
                        subNama: r.subNama || subMap[subId] || subId
                    });
                });
            });
            return all.sort((a, b) => String(b.id || '').localeCompare(String(a.id || '')));
        }

        function renderRiwayatSubMenu() {
            const filterSub = document.getElementById('filterRiwayatSub').value || 'ALL';
            const filterJenis = document.getElementById('filterRiwayatJenis').value || 'ALL';
            const keyword = (document.getElementById('cariRiwayat').value || '').trim().toLowerCase();

            const list = ambilSemuaRiwayat().filter(trx => {
                if (filterSub !== 'ALL' && trx.subId !== filterSub) return false;
                if (filterJenis !== 'ALL' && trx.jenis !== filterJenis) return false;
                if (keyword) {
                    const hay = `${trx.nama || ''} ${trx.asalBarang || ''} ${trx.keterangan || ''}`.toLowerCase();
                    if (!hay.includes(keyword)) return false;
                }
                return true;
            });

            document.getElementById('totalRiwayatInfo').textContent = `${list.length} transaksi`;
            const tbody = document.getElementById('tbodyRiwayatSubMenu');
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center text-muted py-3">Belum ada riwayat masuk/keluar sesuai filter.</td></tr>`;
                return;
            }

            list.forEach((trx, idx) => {
                const isMasuk = trx.jenis === 'MASUK';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="text-center text-muted fw-bold">${idx + 1}</td>
                    <td class="text-success fw-semibold">${isMasuk ? formatTanggalID(trx.tanggalMasuk) : '-'}</td>
                    <td class="text-danger fw-semibold">${!isMasuk ? formatTanggalID(trx.tanggalKeluar) : '-'}</td>
                    <td>
                        <span class="badge ${isMasuk ? 'bg-success-subtle text-success border border-success-subtle' : 'bg-danger-subtle text-danger border border-danger-subtle'}">
                            ${isMasuk ? 'MASUK' : 'KELUAR'}
                        </span>
                    </td>
                    <td><strong>${trx.nama}</strong></td>
                    <td>${isMasuk ? (trx.asalBarang || '-') : '-'}</td>
                    <td class="text-center fw-bold ${isMasuk ? 'text-success' : 'text-danger'}">
                        ${isMasuk ? '+' : '-'}${Number(trx.qty || 0).toLocaleString()}
                    </td>
                    <td class="text-center fw-bold text-primary">${Number(trx.sisaStok || 0).toLocaleString()}</td>
                    <td>${trx.keterangan || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadHtmlDenganSubMenu() {
            tulisKeBlokHtmlDanStorage(true);
            const htmlContent = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'menu_stok.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        renderSubMenuStrip();
        initFirebaseRealtime();
    </script>
</body>
</html>
