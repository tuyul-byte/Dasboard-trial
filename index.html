<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Sistem Gudang</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #eef2f5; font-size: 0.82rem; }

        .dashboard-container {
            max-width: 840px;
            margin: 20px auto;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .app-header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .app-header h4 { font-size: 1.12rem; font-weight: 700; margin-bottom: 2px; }
        .app-header p { font-size: 0.74rem; opacity: 0.8; margin-bottom: 0; }

        .btn-header {
            font-size: 0.74rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 50rem;
            background: rgba(255,255,255,0.16);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.3);
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-header:hover { background: rgba(255,255,255,0.28); }

        .section-label {
            font-size: 0.78rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 18px 0 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .section-label:first-child { margin-top: 0; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .menu-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 18px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .menu-card:hover {
            transform: translateY(-3px);
            background: #ffffff;
            border-color: #0d6efd;
            box-shadow: 0 6px 16px rgba(15, 23, 42, 0.08);
        }
        .menu-card i {
            font-size: 1.85rem;
            margin-bottom: 8px;
            display: block;
        }
        .menu-card .menu-title {
            font-size: 0.82rem;
            font-weight: 700;
            color: #1e293b;
            display: block;
        }
        .menu-card .menu-desc {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 2px;
            display: block;
        }

        .frame-wrapper {
            display: none;
            padding: 14px;
            background: #f8fafc;
        }
        .content-frame {
            width: 100%;
            min-height: 76vh;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            background: #ffffff;
        }

        /* Pop-up Android Modern */
        .android-dialog-content {
            border-radius: 24px;
            border: none;
            background: #f8fafc;
            box-shadow: 0 12px 32px rgba(15, 23, 42, 0.22);
            padding: 8px 6px 4px;
        }
        .android-dialog-title { font-size: 0.95rem; font-weight: 700; color: #0f172a; }
        .android-dialog-body { font-size: 0.8rem; color: #475569; line-height: 1.45; }
        .android-btn-pill { border-radius: 50rem; font-size: 0.78rem; font-weight: 600; padding: 6px 16px; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- HEADER -->
        <div class="app-header">
            <div style="min-width: 90px;">
                <button id="btnBackDashboard" class="btn-header d-none" onclick="kembaliKeDashboard()">
                    <i class="fas fa-arrow-left me-1"></i>Dashboard
                </button>
            </div>
            <div class="text-center flex-grow-1">
                <h4 id="headerTitle"><i class="fas fa-gauge-high me-2"></i>Dashboard Gudang</h4>
                <p id="headerSubtitle">Pusat akses menu Staff, Admin, dan modul tambahan</p>
            </div>
            <div class="text-end" style="min-width: 90px;">
                <button class="btn-header" onclick="bukaModalTambahMenu()" title="Tambah menu baru">
                    <i class="fas fa-plus me-1"></i>Menu
                </button>
            </div>
        </div>

        <!-- AREA KARTU DASHBOARD -->
        <div id="dashboardView" class="p-3 p-md-4">
            <div class="section-label"><i class="fas fa-user-check text-success"></i> Menu Staff</div>
            <div id="gridStaff" class="menu-grid"></div>

            <div class="section-label"><i class="fas fa-user-shield text-primary"></i> Menu Admin</div>
            <div id="gridAdmin" class="menu-grid"></div>

            <div class="section-label"><i class="fas fa-layer-group text-info"></i> Menu Tambahan</div>
            <div id="gridTambahan" class="menu-grid"></div>
        </div>

        <!-- AREA TAMPILAN HALAMAN / MODUL TERPILIH -->
        <div id="pageView" class="frame-wrapper">
            <iframe id="pageFrame" class="content-frame" title="Konten Menu"></iframe>
        </div>
    </div>

    <!-- POP-UP PIN / PASSWORD ADMIN -->
    <div class="modal fade" id="modalPinAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title">
                        <i class="fas fa-lock me-1 text-primary"></i>Verifikasi Admin
                    </h6>
                </div>
                <form id="formVerifikasiPin" onsubmit="verifikasiPinAdmin(event)">
                    <div class="modal-body android-dialog-body pt-1 pb-2">
                        <p class="mb-2">Masukkan PIN atau password khusus untuk membuka Menu Admin.</p>
                        <input type="password" id="inputPinAdmin" class="form-control form-control-sm" placeholder="Masukkan PIN / Password..." autocomplete="current-password" required>
                        <div id="pinErrorMsg" class="text-danger mt-1 d-none" style="font-size: 0.74rem;">
                            PIN atau password salah. Silakan coba lagi.
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-1 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light text-secondary android-btn-pill" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary android-btn-pill">Masuk</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- POP-UP ANDROID MODERN: TAMBAH MENU DINAMIS -->
    <div class="modal fade" id="modalTambahMenu" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title">Tambah Menu Baru</h6>
                </div>
                <form id="formTambahMenu" onsubmit="simpanMenuBaru(event)">
                    <div class="modal-body android-dialog-body pt-1 pb-2">
                        <div class="mb-2">
                            <label class="form-label">Kategori</label>
                            <select id="newMenuRole" class="form-select form-select-sm" required>
                                <option value="tambahan">Menu Tambahan</option>
                                <option value="staff">Menu Staff</option>
                                <option value="admin">Menu Admin</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nama Menu</label>
                            <input type="text" id="newMenuJudul" class="form-control form-control-sm" placeholder="Contoh: Barang Masuk" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Keterangan Singkat</label>
                            <input type="text" id="newMenuDesc" class="form-control form-control-sm" placeholder="Contoh: Catat kedatangan supplier">
                        </div>
                        <div class="mb-1">
                            <label class="form-label">Nama File / URL</label>
                            <input type="text" id="newMenuUrl" class="form-control form-control-sm" placeholder="Contoh: barang_masuk.html" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-1 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light text-secondary android-btn-pill" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary android-btn-pill">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- POP-UP INFORMASI ANDROID MODERN -->
    <div class="modal fade" id="androidInfoModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title" id="androidInfoTitle">Informasi</h6>
                </div>
                <div class="modal-body android-dialog-body pt-1 pb-2">
                    <p id="androidInfoMessage" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0 pt-1">
                    <button type="button" class="btn btn-primary android-btn-pill" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const STORAGE_KEY = 'gudang_dashboard_menus_v1';
        const ADMIN_PIN = '1234'; // Ganti dengan PIN atau password khusus Admin Anda

        let adminUnlocked = false;
        let pendingAdminMenu = null;

        const DEFAULT_MENUS = [
            {
                id: 'staff-request',
                role: 'staff',
                judul: 'Request Barang',
                deskripsi: 'Ajukan permintaan & cek stok',
                ikon: 'fa-share-from-square',
                warna: 'text-success',
                url: 'request_staff.html'
            },
            {
                id: 'admin-gudang',
                role: 'admin',
                judul: 'Kelola Stok & Rekap',
                deskripsi: 'Stok, riwayat, rekap & input',
                ikon: 'fa-user-shield',
                warna: 'text-primary',
                url: 'admin_gudang.html'
            },
            {
                id: 'tambahan-incoming',
                role: 'tambahan',
                judul: 'Barang Masuk / PO',
                deskripsi: 'Penerimaan barang supplier',
                ikon: 'fa-truck-ramp-box',
                warna: 'text-info',
                url: 'barang_masuk.html'
            },
            {
                id: 'tambahan-opname',
                role: 'tambahan',
                judul: 'Stock Opname',
                deskripsi: 'Pengecekan fisik & selisih',
                ikon: 'fa-clipboard-check',
                warna: 'text-warning',
                url: 'stock_opname.html'
            }
        ];

        function muatDaftarMenu() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...DEFAULT_MENUS];
        }

        let daftarMenu = muatDaftarMenu();

        function simpanDaftarMenu() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(daftarMenu));
            } catch (e) {}
        }

        function tampilkanInfo(judul, pesan) {
            document.getElementById('androidInfoTitle').textContent = judul;
            document.getElementById('androidInfoMessage').textContent = pesan;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('androidInfoModal')).show();
        }

        function renderDashboard() {
            const grids = {
                staff: document.getElementById('gridStaff'),
                admin: document.getElementById('gridAdmin'),
                tambahan: document.getElementById('gridTambahan')
            };

            Object.values(grids).forEach(el => { el.innerHTML = ''; });

            daftarMenu.forEach(menu => {
                const targetGrid = grids[menu.role] || grids.tambahan;
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.onclick = () => tanganiKlikMenu(menu);
                card.innerHTML = `
                    <i class="fas ${menu.ikon || 'fa-folder-open'} ${menu.warna || 'text-secondary'}"></i>
                    <span class="menu-title">${menu.judul}</span>
                    <span class="menu-desc">${menu.deskripsi || ''}</span>
                `;
                targetGrid.appendChild(card);
            });
        }

        function tanganiKlikMenu(menu) {
            if (menu.role === 'admin' && !adminUnlocked) {
                pendingAdminMenu = menu;
                document.getElementById('formVerifikasiPin').reset();
                document.getElementById('pinErrorMsg').classList.add('d-none');
                const modalEl = document.getElementById('modalPinAdmin');
                const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modalEl.addEventListener('shown.bs.modal', () => {
                    document.getElementById('inputPinAdmin').focus();
                }, { once: true });
                modal.show();
                return;
            }
            bukaMenu(menu);
        }

        function verifikasiPinAdmin(event) {
            event.preventDefault();
            const inputVal = document.getElementById('inputPinAdmin').value;
            if (inputVal === ADMIN_PIN) {
                adminUnlocked = true;
                const targetMenu = pendingAdminMenu;
                pendingAdminMenu = null;
                document.getElementById('pinErrorMsg').classList.add('d-none');
                bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPinAdmin')).hide();
                if (targetMenu) bukaMenu(targetMenu);
            } else {
                document.getElementById('pinErrorMsg').classList.remove('d-none');
                const inputEl = document.getElementById('inputPinAdmin');
                inputEl.value = '';
                inputEl.focus();
            }
        }

        function bukaMenu(menu) {
            document.getElementById('dashboardView').style.display = 'none';
            document.getElementById('pageView').style.display = 'block';
            document.getElementById('btnBackDashboard').classList.remove('d-none');
            document.getElementById('headerTitle').innerHTML = `<i class="fas ${menu.ikon || 'fa-folder-open'} me-2"></i>${menu.judul}`;
            document.getElementById('headerSubtitle').textContent = menu.deskripsi || menu.url;

            const frame = document.getElementById('pageFrame');
            frame.src = menu.url;
        }

        function kembaliKeDashboard() {
            document.getElementById('pageView').style.display = 'none';
            document.getElementById('dashboardView').style.display = 'block';
            document.getElementById('btnBackDashboard').classList.add('d-none');
            document.getElementById('headerTitle').innerHTML = `<i class="fas fa-gauge-high me-2"></i>Dashboard Gudang`;
            document.getElementById('headerSubtitle').textContent = 'Pusat akses menu Staff, Admin, dan modul tambahan';
            document.getElementById('pageFrame').src = 'about:blank';
        }

        function bukaModalTambahMenu() {
            document.getElementById('formTambahMenu').reset();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTambahMenu')).show();
        }

        function simpanMenuBaru(event) {
            event.preventDefault();
            const role = document.getElementById('newMenuRole').value;
            const judul = document.getElementById('newMenuJudul').value.trim();
            const deskripsi = document.getElementById('newMenuDesc').value.trim();
            const url = document.getElementById('newMenuUrl').value.trim();

            if (!judul || !url) return;

            const iconByRole = {
                staff: { ikon: 'fa-clipboard-list', warna: 'text-success' },
                admin: { ikon: 'fa-sliders', warna: 'text-primary' },
                tambahan: { ikon: 'fa-puzzle-piece', warna: 'text-info' }
            };
            const stylePick = iconByRole[role] || iconByRole.tambahan;

            daftarMenu.push({
                id: `${role}-${Date.now()}`,
                role,
                judul,
                deskripsi,
                ikon: stylePick.ikon,
                warna: stylePick.warna,
                url
            });

            simpanDaftarMenu();
            renderDashboard();

            const modalEl = document.getElementById('modalTambahMenu');
            bootstrap.Modal.getOrCreateInstance(modalEl).hide();
            tampilkanInfo('Menu Ditambahkan', `Menu "${judul}" berhasil ditambahkan ke dashboard.`);
        }

        renderDashboard();
    </script>
</body>
</html>
