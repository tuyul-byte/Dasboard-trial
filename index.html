<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gudang App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            background-color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.76rem;
            color: #0f172a;
        }

        /* Splash screen layar penuh tanpa logo */
        #androidSplash {
            position: fixed;
            inset: 0;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        #androidSplash.hide {
            opacity: 0;
            visibility: hidden;
        }
        #androidSplash .splash-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.4px;
        }
        #androidSplash .splash-sub {
            font-size: 0.72rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .android-shell {
            max-width: 480px;
            min-height: 100vh;
            margin: 0 auto;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        /* Sticky top bar */
        .android-topbar {
            position: sticky;
            top: 0;
            z-index: 1020;
            height: 48px;
            padding: 0 8px;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 1px 4px rgba(15, 23, 42, 0.18);
        }

        .topbar-title-wrap {
            flex: 1;
            min-width: 0;
            padding: 0 6px;
        }
        .topbar-title {
            font-size: 0.84rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.15;
        }
        .topbar-sub {
            font-size: 0.66rem;
            color: #cbd5e1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.1;
        }

        /* Tombol ikon tanpa border & tanpa badge */
        .icon-only-btn {
            width: 34px;
            height: 34px;
            border: none;
            background: transparent;
            color: #ffffff;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.88rem;
            cursor: pointer;
            padding: 0;
        }
        .icon-only-btn:active {
            background: rgba(255, 255, 255, 0.14);
        }

        .launcher-body {
            padding: 10px 10px 16px;
        }

        .mini-section-title {
            font-size: 0.68rem;
            font-weight: 700;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin: 10px 2px 6px;
        }
        .mini-section-title:first-child {
            margin-top: 2px;
        }

        /* Grid mini menu / icon */
        .mini-icon-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .mini-icon-tile {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 10px 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            min-height: 70px;
        }
        .mini-icon-tile:active {
            background: #eef2ff;
            border-color: #93c5fd;
        }
        .mini-icon-tile i {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .mini-icon-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: #1e293b;
            line-height: 1.15;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .frame-container {
            display: none;
            flex: 1;
            padding: 8px;
        }
        .app-frame {
            width: 100%;
            height: calc(100vh - 64px);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #ffffff;
        }

        /* Pop-up Android Modern */
        .android-dialog-content {
            border-radius: 22px;
            border: none;
            background: #ffffff;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.2);
            padding: 6px 4px 2px;
        }
        .android-dialog-title { font-size: 0.88rem; font-weight: 700; color: #0f172a; }
        .android-dialog-body { font-size: 0.76rem; color: #475569; line-height: 1.4; }
        .android-dialog-body .form-label { font-size: 0.72rem; font-weight: 600; margin-bottom: 2px; }
        .android-dialog-body .form-control,
        .android-dialog-body .form-select { font-size: 0.76rem; padding: 5px 8px; border-radius: 8px; }
        .android-btn-pill { border-radius: 50rem; font-size: 0.74rem; font-weight: 600; padding: 5px 14px; }
    </style>
</head>
<body>

    <!-- Splash Screen Layar Penuh Tanpa Logo -->
    <div id="androidSplash">
        <div class="splash-title">Sistem Gudang</div>
        <div class="splash-sub">Memuat menu...</div>
    </div>

    <div class="android-shell">
        <!-- Sticky Top Bar -->
        <header class="android-topbar">
            <div class="d-flex align-items-center">
                <button id="btnBackMenu" class="icon-only-btn d-none" onclick="kembaliKeMenuUtama()" title="Kembali">
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>

            <div class="topbar-title-wrap">
                <div id="topTitle" class="topbar-title">Menu Gudang</div>
                <div id="topSub" class="topbar-sub">Staff • Admin • Tambahan</div>
            </div>

            <div class="d-flex align-items-center gap-1">
                <button id="btnLockAdmin" class="icon-only-btn d-none" onclick="kunciAksesAdmin()" title="Kunci Admin">
                    <i class="fas fa-lock"></i>
                </button>
                <button class="icon-only-btn" onclick="bukaModalTambahMenu()" title="Tambah Menu">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </header>

        <!-- Layar Awal Mini Menu / Icon -->
        <main id="launcherView" class="launcher-body">
            <div class="mini-section-title">Staff</div>
            <div id="gridStaff" class="mini-icon-grid"></div>

            <div class="mini-section-title">Admin</div>
            <div id="gridAdmin" class="mini-icon-grid"></div>

            <div class="mini-section-title">Menu Tambahan</div>
            <div id="gridTambahan" class="mini-icon-grid"></div>
        </main>

        <!-- Konten Halaman -->
        <section id="frameView" class="frame-container">
            <iframe id="menuFrame" class="app-frame" title="Halaman Menu"></iframe>
        </section>
    </div>

    <!-- Pop-up PIN / Password Admin -->
    <div class="modal fade" id="modalPinAdmin" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title">PIN / Password Admin</h6>
                </div>
                <form id="formPinAdmin" onsubmit="verifikasiPinAdmin(event)">
                    <div class="modal-body android-dialog-body pt-1 pb-2">
                        <input type="password" id="inputPinAdmin" class="form-control" placeholder="Masukkan PIN atau password..." autocomplete="current-password" required>
                        <div id="pinError" class="text-danger mt-1 d-none" style="font-size: 0.7rem;">
                            PIN atau password salah.
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-1 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light text-secondary android-btn-pill" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary android-btn-pill">Masuk</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Pop-up Tambah Mini Menu -->
    <div class="modal fade" id="modalTambahMenu" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title">Tambah Mini Menu</h6>
                </div>
                <form id="formTambahMenu" onsubmit="simpanMiniMenu(event)">
                    <div class="modal-body android-dialog-body pt-1 pb-2">
                        <div class="mb-2">
                            <label class="form-label">Bagian</label>
                            <select id="newRole" class="form-select" required>
                                <option value="tambahan">Menu Tambahan</option>
                                <option value="staff">Staff</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Nama Menu</label>
                            <input type="text" id="newJudul" class="form-control" placeholder="Contoh: Barang Masuk" required>
                        </div>
                        <div class="mb-1">
                            <label class="form-label">File / URL</label>
                            <input type="text" id="newUrl" class="form-control" placeholder="Contoh: barang_masuk.html" required>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-1 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-light text-secondary android-btn-pill" data-bs-dismiss="modal">Batal</button>
                        <button type="submit" class="btn btn-primary android-btn-pill">Simpan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Pop-up Info Android Modern -->
    <div class="modal fade" id="modalInfo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content android-dialog-content">
                <div class="modal-header border-0 pb-1">
                    <h6 class="modal-title android-dialog-title" id="infoTitle">Info</h6>
                </div>
                <div class="modal-body android-dialog-body pt-1 pb-2">
                    <p id="infoMsg" class="mb-0"></p>
                </div>
                <div class="modal-footer border-0 pt-1">
                    <button type="button" class="btn btn-primary android-btn-pill" data-bs-dismiss="modal">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const STORAGE_KEY = 'gudang_android_mini_menus_v1';
        const ADMIN_PIN = '1234'; // Ganti dengan PIN atau password khusus Admin Anda

        let adminUnlocked = false;
        let pendingAdminMenu = null;

        const DEFAULT_MENUS = [
            { id: 'st-1', role: 'staff', judul: 'Request', ikon: 'fa-share-from-square', warna: 'text-success', url: 'request_staff.html' },
            { id: 'st-2', role: 'staff', judul: 'Cek Stok', ikon: 'fa-boxes-stacked', warna: 'text-success', url: 'request_staff.html' },
            { id: 'st-3', role: 'staff', judul: 'Riwayat', ikon: 'fa-clock-rotate-left', warna: 'text-success', url: 'request_staff.html' },

            { id: 'ad-1', role: 'admin', judul: 'Kelola Stok', ikon: 'fa-user-shield', warna: 'text-primary', url: 'admin_gudang.html' },
            { id: 'ad-2', role: 'admin', judul: 'Rekap Bln', ikon: 'fa-calendar-days', warna: 'text-primary', url: 'admin_gudang.html' },
            { id: 'ad-3', role: 'admin', judul: 'Input Stok', ikon: 'fa-square-plus', warna: 'text-primary', url: 'admin_gudang.html' },

            { id: 'tb-1', role: 'tambahan', judul: 'Masuk / PO', ikon: 'fa-truck-ramp-box', warna: 'text-info', url: 'barang_masuk.html' },
            { id: 'tb-2', role: 'tambahan', judul: 'Opname', ikon: 'fa-clipboard-check', warna: 'text-warning', url: 'stock_opname.html' },
            { id: 'tb-3', role: 'tambahan', judul: 'Laporan', ikon: 'fa-file-lines', warna: 'text-secondary', url: 'laporan.html' }
        ];

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('androidSplash');
                if (splash) {
                    splash.classList.add('hide');
                    setTimeout(() => splash.remove(), 350);
                }
            }, 600);
        });

        function muatMenu() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch (e) {}
            return [...DEFAULT_MENUS];
        }

        let daftarMenu = muatMenu();

        function simpanMenu() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(daftarMenu));
            } catch (e) {}
        }

        function perbaruiTombolKunciAdmin() {
            const btnLock = document.getElementById('btnLockAdmin');
            if (!btnLock) return;
            if (adminUnlocked) {
                btnLock.classList.remove('d-none');
            } else {
                btnLock.classList.add('d-none');
            }
        }

        function kunciAksesAdmin() {
            adminUnlocked = false;
            pendingAdminMenu = null;
            perbaruiTombolKunciAdmin();
            kembaliKeMenuUtama();
            tampilkanInfo('Dikunci', 'Akses Admin telah dikunci kembali.');
        }

        function tampilkanInfo(judul, pesan) {
            document.getElementById('infoTitle').textContent = judul;
            document.getElementById('infoMsg').textContent = pesan;
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalInfo')).show();
        }

        function renderMiniMenus() {
            const grids = {
                staff: document.getElementById('gridStaff'),
                admin: document.getElementById('gridAdmin'),
                tambahan: document.getElementById('gridTambahan')
            };

            Object.values(grids).forEach(g => { g.innerHTML = ''; });

            daftarMenu.forEach(item => {
                const grid = grids[item.role] || grids.tambahan;
                const tile = document.createElement('div');
                tile.className = 'mini-icon-tile';
                tile.onclick = () => klikMiniMenu(item);
                tile.innerHTML = `
                    <i class="fas ${item.ikon || 'fa-border-all'} ${item.warna || 'text-dark'}"></i>
                    <span class="mini-icon-label">${item.judul}</span>
                `;
                grid.appendChild(tile);
            });
        }

        function klikMiniMenu(item) {
            if (item.role === 'admin' && !adminUnlocked) {
                pendingAdminMenu = item;
                document.getElementById('formPinAdmin').reset();
                document.getElementById('pinError').classList.add('d-none');
                const modalEl = document.getElementById('modalPinAdmin');
                const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
                modalEl.addEventListener('shown.bs.modal', () => {
                    document.getElementById('inputPinAdmin').focus();
                }, { once: true });
                modal.show();
                return;
            }
            bukaHalamanMenu(item);
        }

        function verifikasiPinAdmin(event) {
            event.preventDefault();
            const val = document.getElementById('inputPinAdmin').value;
            if (val === ADMIN_PIN) {
                adminUnlocked = true;
                perbaruiTombolKunciAdmin();
                const target = pendingAdminMenu;
                pendingAdminMenu = null;
                document.getElementById('pinError').classList.add('d-none');
                bootstrap.Modal.getOrCreateInstance(document.getElementById('modalPinAdmin')).hide();
                if (target) bukaHalamanMenu(target);
            } else {
                document.getElementById('pinError').classList.remove('d-none');
                const inp = document.getElementById('inputPinAdmin');
                inp.value = '';
                inp.focus();
            }
        }

        function bukaHalamanMenu(item) {
            document.getElementById('launcherView').style.display = 'none';
            document.getElementById('frameView').style.display = 'block';
            document.getElementById('btnBackMenu').classList.remove('d-none');
            document.getElementById('topTitle').textContent = item.judul;
            document.getElementById('topSub').textContent = item.url;
            document.getElementById('menuFrame').src = item.url;
        }

        function kembaliKeMenuUtama() {
            adminUnlocked = false;
            pendingAdminMenu = null;
            perbaruiTombolKunciAdmin();

            document.getElementById('frameView').style.display = 'none';
            document.getElementById('launcherView').style.display = 'block';
            document.getElementById('btnBackMenu').classList.add('d-none');
            document.getElementById('topTitle').textContent = 'Menu Gudang';
            document.getElementById('topSub').textContent = 'Staff • Admin • Tambahan';
            document.getElementById('menuFrame').src = 'about:blank';
        }

        function bukaModalTambahMenu() {
            document.getElementById('formTambahMenu').reset();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTambahMenu')).show();
        }

        function simpanMiniMenu(event) {
            event.preventDefault();
            const role = document.getElementById('newRole').value;
            const judul = document.getElementById('newJudul').value.trim();
            const url = document.getElementById('newUrl').value.trim();
            if (!judul || !url) return;

            const palette = {
                staff: { ikon: 'fa-clipboard-check', warna: 'text-success' },
                admin: { ikon: 'fa-sliders', warna: 'text-primary' },
                tambahan: { ikon: 'fa-puzzle-piece', warna: 'text-info' }
            };
            const pick = palette[role] || palette.tambahan;

            daftarMenu.push({
                id: `${role}-${Date.now()}`,
                role,
                judul,
                ikon: pick.ikon,
                warna: pick.warna,
                url
            });

            simpanMenu();
            renderMiniMenus();
            bootstrap.Modal.getOrCreateInstance(document.getElementById('modalTambahMenu')).hide();
            tampilkanInfo('Tersimpan', `Mini menu "${judul}" ditambahkan.`);
        }

        perbaruiTombolKunciAdmin();
        renderMiniMenus();
    </script>
</body>
</html>
